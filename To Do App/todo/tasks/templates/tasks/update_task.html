<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">

<style>

    body{
        background-color: #538CB8;
    }

    .heading{
        margin: 20px;
        text-align: center;
        color: #fff;
        font-size: 50px;
    }

    input {
        width: 100%;
        padding: 12px 20px;
        margin: 8px 0;
        box-sizing: border-box;
    }

    input::placeholder {
        color: #d3d3d3;
    }

    .submit{
        margin-top: 20px;
        margin-left: 200px;
        margin-right: 200px;
    }

    .center-column{
        width:600px;
        margin: 20px auto;
        padding:20px;
        background-color: #fff;
        border-radius: 3px;
        box-shadow: 6px 2px 30px 0px rgba(0,0,0,0.75);
        justify-content: center;
    }

    .complete-field{
        text-align: center;
        font-size: 20px;
    }

    input[type="checkbox"]{
        margin-top: 30px;
        width: 15px;
        height: 15px;
    }

</style>

<head>
    <title>Update Task</title>
</head>

<div class="heading">
    <strong>Update Task</strong>
</div>

<div class="center-column">
    <form method="POST" action="">
        <div class="complete-field">
            {% csrf_token %}

            {{form}}
        </div>
        <div class="submit">
            <input class="btn btn-info" type="submit" name="Update Task">
        </div>
    </form>
</div>
